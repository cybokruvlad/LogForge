[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "logforge"
version = "0.1.0"
description = "A Python application log analysis engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.14",
    "coverage>=7.10",
]

[project.scripts]
logforge = "logforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["logforge"]
omit = ["src/logforge/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
